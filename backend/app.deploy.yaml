runtime: python312
env: standard
# CI test deploy: scale to zero between smoke test and promotion.
instance_class: F1
entrypoint: gunicorn -b :$PORT --workers 1 --threads 4 --worker-class gthread --timeout 60 app:app
env_variables:
  RENDER_CACHE_MAX_BYTES: "83886080"
automatic_scaling:
  min_instances: 0
  max_instances: 2
  target_cpu_utilization: 0.7
  max_concurrent_requests: 8