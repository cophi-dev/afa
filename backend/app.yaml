runtime: python312
env: standard
# F2 (1.2 GHz, 768 MB) instead of the default F1: renders are CPU-bound PIL compositing.
instance_class: F2
# 2 processes x 4 threads (was a single sync worker = one render at a time per instance).
entrypoint: gunicorn -b :$PORT --workers 2 --threads 4 --worker-class gthread --timeout 60 app:app
env_variables:
  RENDER_CACHE_MAX_BYTES: "83886080"
automatic_scaling:
  min_instances: 1
  max_instances: 4
  target_cpu_utilization: 0.7
  max_concurrent_requests: 8
